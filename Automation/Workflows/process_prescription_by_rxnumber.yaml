workflow: process_prescription_by_rxnumber

steps:
  - assert: screen.mainForm

  - scan_table:
      target: mainForm.prescriptionGrid
      search_column: Rx Number
      match: vars.rxNumber
      scroll_strategy: page_down_until_found
      on_found:
        - click: vars.targetRow
      on_not_found: fail

  - invoke: mainForm.processButton

  - wait_for_element:
      target: processForm.continueButton
      timeout_ms: 5000
      on_timeout:
        action: fail

  - read_table:
      target: processForm.processGrid
      columns:
        - Rx Number
        - Patient Name
        - Drug Name
      into: vars.processRows

  - click: processForm.continueButton

  - read_area:
      target: mainForm.successToastMessage
      into: vars.toastMessage
      timeout_ms: 5000
      success_pattern: '^Successfully processed'
