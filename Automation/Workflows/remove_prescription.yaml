workflow: remove_prescription

steps:
  - assert: screen.mainForm

  - scan_table:
      target: mainForm.prescriptionGrid
      search_column: Rx Number
      match: vars.rxNumber
      scroll_strategy: page_down_until_found
      on_found:
        - click: vars.targetRow
      on_not_found: fail

  - click: mainForm.removeButton

  - wait_for_element:
      target: mainForm.removeConfirmDialog
      timeout_ms: 3000
      on_timeout:
        action: fail

  - click_by_name:
      target: mainForm.removeConfirmYesButton

  - wait_for_disappear:
      target: mainForm.removeConfirmDialog
      timeout_ms: 3000
      on_timeout:
        action: fail
